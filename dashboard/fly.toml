app = 'mnemopay-landing'
primary_region = 'dfw'

[build]

[http_service]
  internal_port = 3200
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/readyz'

[env]
  MNEMOPAY_CONSOLE_STORE_DRIVER = 'postgres'
  NODE_ENV = 'production'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

name: Dashboard CI

on:
  push:
    branches: [master, main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install SDK build deps (root)
        working-directory: .
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Build SDK (dist/)
        working-directory: .
        run: npm run build
        continue-on-error: true # smoke test has SDK fallback if dist is missing

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm install

      - name: Syntax check
        working-directory: dashboard
        run: node --check server.js

      - name: Unit tests
        working-directory: dashboard
        run: npm run test:unit

      - name: Smoke test
        working-directory: dashboard
        run: npm run test:smoke
        env:
          NODE_ENV: test

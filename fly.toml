app = 'mnemopay-mcp'
primary_region = 'dfw'

[build]

[env]
  PORT = '3200'
  MNEMOPAY_MODE = 'quick'
  NODE_ENV = 'production'
  MNEMOPAY_PERSIST_DIR = '/data'
  MNEMOPAY_URL = 'https://mnemopay-mcp.fly.dev'
  # First-party metering profile: disable the 30-min settlement hold + relax the
  # fraud/velocity gate so per-LLM-call micro-charges settle immediately.
  MNEMOPAY_METERING = '1'
  MNEMOPAY_AGENT_ID = 'mnemopay-ide'
  # Auth is the simple Bearer MNEMOPAY_MCP_TOKEN (set as a secret), NOT the
  # getbizsuite portal key flow — the IDE's MnemoPayClient sends Bearer only.
  REQUIRE_PORTAL_AUTH = 'false'

[mounts]
  source = 'mnemopay_data'
  destination = '/data'

[http_service]
  internal_port = 3200
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  path = '/health'
  timeout = '5s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
